{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4 text-center">
      <h3 class="mb-3">Password changed</h3>
      <p class="text-muted">Your password has been updated. You can now log in with it.</p>
      <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
    </div></div>
  </div>
</div>
{% endblock %}
