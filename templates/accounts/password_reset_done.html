{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4 text-center">
      <h3 class="mb-3">Check your email</h3>
      <p class="text-muted">If an account exists for that email, we've sent a link to reset your password. It may take a minute to arrive.</p>
      <a class="btn btn-primary" href="{% url 'login' %}">Back to login</a>
    </div></div>
  </div>
</div>
{% endblock %}
