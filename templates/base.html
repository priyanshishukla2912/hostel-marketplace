<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hostel Marketplace{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark" style="background:#C2185B;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">Hostel Marketplace</a>
    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="text-white">Hi, {{ user.username }}</span>
        <a class="btn btn-outline-light btn-sm" href="{% url 'profile' %}">Profile</a>
        <a class="btn btn-warning btn-sm" href="{% url 'create_listing' %}">Sell an item</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-light btn-sm">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
